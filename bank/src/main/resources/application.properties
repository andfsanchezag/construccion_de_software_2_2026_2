# Server Configuration
server.port=8081

# MySQL Configuration (Auto-generación de tablas relacionales)
# Default: host-local run. Under Docker Compose use DB_URL=jdbc:mysql://mysql-db:3306/bank_db?... .
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (Auditoría NoSQL)
# Spring Boot 4.x usa el prefijo spring.mongodb (spring-boot-mongodb module).
# Default: host-local run. Under Docker Compose use MONGODB_URI=mongodb://mongo-db:27017/audit_db.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/audit_db}

# Security & JWT Configuration
# JWT_SECRET has no default on purpose: a shared/known fallback would let anyone
# forge valid tokens. The app must fail fast at startup if it is not provided.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}